name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: python scripts/check_public.py
      - run: luac -p openwrt/monitor.lua && luac -p openwrt/collectors.lua && sh -n openwrt/install.sh && sh -n openwrt/uninstall.sh
      - run: lua tests/collectors_test.lua
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm test
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -d firmware
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: routerdock-generic-build
          path: artifacts/
