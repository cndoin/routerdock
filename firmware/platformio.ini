[platformio]
default_envs = esp32-crowpanel-28

[env:esp32-crowpanel-28]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.7
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
build_flags =
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DWEBSERVER_MAX_POST_ARGS=16
    -DWEBSERVER_MAX_POST_ARG_LEN=2048
